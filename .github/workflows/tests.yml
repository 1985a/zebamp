# Runs the code standards and the test suite on every push and pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (MPD for the tests, libraries Qt needs off screen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpd mpc \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          # the tests start their own private MPD; the system one is not needed
          sudo systemctl disable --now mpd.service mpd.socket || true

      - name: Python packages
        run: pip install PySide6 python-mpd2 numpy mutagen ruff

      - name: Code standards
        run: ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
